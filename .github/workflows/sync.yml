name: Sync Bitbucket Contributions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get existing commit dates
        run: |
          git log --format='%aI' | sort -u > /tmp/existing_dates.txt
          echo "Existing commits: $(wc -l < /tmp/existing_dates.txt)"

      - name: Fetch Bitbucket commits
        env:
          BB_AUTH: ${{ secrets.BB_AUTH }}
        run: |
          set +e

          # Get all repo slugs
          > /tmp/all_repos.txt
          PAGE=1
          while true; do
            RESPONSE=$(curl -s -u "$BB_AUTH" "https://api.bitbucket.org/2.0/repositories/britive?pagelen=100&page=$PAGE")
            echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read(), strict=False)
          for r in data.get('values', []):
              print(r['slug'])
          " >> /tmp/all_repos.txt 2>/dev/null
            HAS_NEXT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read(), strict=False)
          print('yes' if data.get('next') else 'no')
          " 2>/dev/null)
            [ "$HAS_NEXT" != "yes" ] && break
            PAGE=$((PAGE + 1))
          done
          echo "Found $(wc -l < /tmp/all_repos.txt) repos"

          # Scan each repo for Samuel Wan commits
          > /tmp/bb_dates.txt
          while IFS= read -r REPO; do
            PAGE=1
            FOUND=0
            while true; do
              RESPONSE=$(curl -s -u "$BB_AUTH" \
                "https://api.bitbucket.org/2.0/repositories/britive/$REPO/commits?pagelen=100&page=$PAGE" 2>/dev/null)
              PARSED=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.loads(sys.stdin.read(), strict=False)
              vals = data.get('values', [])
              if not vals:
                  print('EMPTY')
                  sys.exit(0)
              has_next = 'yes' if data.get('next') else 'no'
              dates = []
              for c in vals:
                  raw = c.get('author', {}).get('raw', '')
                  if 'Samuel Wan' in raw or 'sam.wan' in raw:
                      dates.append(c['date'])
              if dates:
                  for d in dates:
                      print(d)
              print('NEXT:' + has_next)
          except:
              print('EMPTY')
          " 2>/dev/null)

              if echo "$PARSED" | grep -q "^EMPTY$"; then
                break
              fi

              DATES=$(echo "$PARSED" | grep -v "^NEXT:")
              if [ -n "$DATES" ]; then
                echo "$DATES" >> /tmp/bb_dates.txt
                NEW=$(echo "$DATES" | wc -l | tr -d ' ')
                FOUND=$((FOUND + NEW))
              fi

              HAS_NEXT=$(echo "$PARSED" | grep "^NEXT:" | cut -d: -f2)
              [ "$HAS_NEXT" != "yes" ] && break
              PAGE=$((PAGE + 1))
            done
            [ $FOUND -gt 0 ] && echo "$REPO: $FOUND commits"
          done < /tmp/all_repos.txt
          echo "Total Bitbucket commits: $(wc -l < /tmp/bb_dates.txt)"

      - name: Create new commits
        run: |
          set +e
          git config user.name "Turtdle"
          git config user.email "47124703+Turtdle@users.noreply.github.com"

          NEW_COUNT=0
          sort -u /tmp/bb_dates.txt | while IFS= read -r DATE; do
            [ -z "$DATE" ] && continue
            if ! grep -qF "$DATE" /tmp/existing_dates.txt 2>/dev/null; then
              GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" \
                git commit --allow-empty -m "work" --quiet
              NEW_COUNT=$((NEW_COUNT + 1))
            fi
          done
          echo "New commits added: $NEW_COUNT"

      - name: Push
        run: |
          AHEAD=$(git rev-list origin/main..HEAD | wc -l | tr -d ' ')
          if [ "$AHEAD" -gt 0 ]; then
            git push origin main
            echo "Pushed $AHEAD new commits"
          else
            echo "No new commits to push"
          fi
