name: Sync Contributions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get existing commit dates
        run: |
          git log --format='%aI' | sort -u > /tmp/existing_dates.txt
          echo "Existing commits: $(wc -l < /tmp/existing_dates.txt)"

      - name: Fetch commits
        env:
          BB_AUTH_B64: ${{ secrets.BB_AUTH_B64 }}
          BB_WORKSPACE: ${{ secrets.BB_WORKSPACE }}
          BB_AUTHOR_MATCH: ${{ secrets.BB_AUTHOR_MATCH }}
        run: |
          set +e

          HTTP_CODE=$(curl -s -o /tmp/bb_test.json -w "%{http_code}" -H "Authorization: Basic $BB_AUTH_B64" "https://api.bitbucket.org/2.0/user")
          echo "API test status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API auth failed."
            exit 1
          fi

          # Build author match pattern for python
          IFS='|' read -ra AUTHORS <<< "$BB_AUTHOR_MATCH"
          AUTHOR_JSON=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1:]))" "${AUTHORS[@]}")

          > /tmp/all_repos.txt
          PAGE=1
          while true; do
            HTTP_CODE=$(curl -s -o /tmp/bb_page.json -w "%{http_code}" -H "Authorization: Basic $BB_AUTH_B64" \
              "https://api.bitbucket.org/2.0/repositories/$BB_WORKSPACE?pagelen=100&page=$PAGE")
            [ "$HTTP_CODE" != "200" ] && break
            python3 -c "
          import json
          with open('/tmp/bb_page.json') as f:
              data = json.loads(f.read(), strict=False)
          for r in data.get('values', []):
              print(r['slug'])
          " >> /tmp/all_repos.txt 2>/dev/null
            HAS_NEXT=$(python3 -c "
          import json
          with open('/tmp/bb_page.json') as f:
              data = json.loads(f.read(), strict=False)
          print('yes' if data.get('next') else 'no')
          " 2>/dev/null)
            [ "$HAS_NEXT" != "yes" ] && break
            PAGE=$((PAGE + 1))
          done
          echo "Found $(wc -l < /tmp/all_repos.txt) repos"

          > /tmp/bb_dates.txt
          REPO_NUM=0
          while IFS= read -r REPO; do
            REPO_NUM=$((REPO_NUM + 1))
            PAGE=1
            FOUND=0
            while true; do
              HTTP_CODE=$(curl -s -o /tmp/bb_commits.json -w "%{http_code}" -H "Authorization: Basic $BB_AUTH_B64" \
                "https://api.bitbucket.org/2.0/repositories/$BB_WORKSPACE/$REPO/commits?pagelen=100&page=$PAGE" 2>/dev/null)
              [ "$HTTP_CODE" != "200" ] && break

              PARSED=$(python3 -c "
          import json, sys
          authors = $AUTHOR_JSON
          try:
              with open('/tmp/bb_commits.json') as f:
                  data = json.loads(f.read(), strict=False)
              vals = data.get('values', [])
              if not vals:
                  print('EMPTY')
              else:
                  has_next = 'yes' if data.get('next') else 'no'
                  for c in vals:
                      raw = c.get('author', {}).get('raw', '')
                      if any(a in raw for a in authors):
                          print(c['date'])
                  print('NEXT:' + has_next)
          except:
              print('EMPTY')
          " 2>/dev/null)

              if echo "$PARSED" | grep -q "^EMPTY$"; then
                break
              fi

              DATES=$(echo "$PARSED" | grep -v "^NEXT:" | grep -v "^$")
              if [ -n "$DATES" ]; then
                echo "$DATES" >> /tmp/bb_dates.txt
                NEW=$(echo "$DATES" | wc -l | tr -d ' ')
                FOUND=$((FOUND + NEW))
              fi

              HAS_NEXT=$(echo "$PARSED" | grep "^NEXT:" | cut -d: -f2)
              [ "$HAS_NEXT" != "yes" ] && break
              PAGE=$((PAGE + 1))
            done
            [ $FOUND -gt 0 ] && echo "$REPO: $FOUND commits"
            [ $((REPO_NUM % 50)) -eq 0 ] && echo "Progress: $REPO_NUM repos scanned..."
          done < /tmp/all_repos.txt
          echo "Total commits: $(wc -l < /tmp/bb_dates.txt)"

      - name: Create new commits
        run: |
          set +e
          git config user.name "Turtdle"
          git config user.email "47124703+Turtdle@users.noreply.github.com"

          sort -u /tmp/bb_dates.txt | while IFS= read -r DATE; do
            [ -z "$DATE" ] && continue
            if ! grep -qF "$DATE" /tmp/existing_dates.txt 2>/dev/null; then
              GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" \
                git commit --allow-empty -m "work" --quiet
            fi
          done

      - name: Push
        run: |
          AHEAD=$(git rev-list origin/main..HEAD | wc -l | tr -d ' ')
          if [ "$AHEAD" -gt 0 ]; then
            git push origin main
            echo "Pushed $AHEAD new commits"
          else
            echo "No new commits to push"
          fi
